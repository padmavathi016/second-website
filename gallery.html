
<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }
        h1 {
            color: purple;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .gallery img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<h1>Our Photo Gallery</h1>

<div class="gallery">
    <img src="class%20room.jpg" alt="Class Room">
    <img src="concert.jpg" alt="Concert">
    <img src="images.jpg" alt="Gallery Image">
    <img src="indu.png" alt="Indu">
    <img src="paddhu.png" alt="Paddhu">
</div>

</body>
</html>
